# ALCF Agent — Hermes config template
#
# Rendered into the live config at container start by scripts/entrypoint.sh,
# which substitutes ${...} placeholders from environment variables and injects
# the freshly-minted Globus access token as the api_key.
#
# IMPORTANT: keep this MINIMAL. Do not add personal fallback providers, stray
# base_urls, or secrets. The packaged agent must have exactly ONE inference
# target so it never silently talks to the wrong host.

model:
  # The ALCF Inference Service is OpenAI-compatible. provider: custom tells
  # Hermes to treat base_url as a raw OpenAI-wire endpoint.
  #
  # provider is set to a NAMED custom provider (custom:alcf-sophia[-reasoning])
  # by the entrypoint so the LAUNCH turn inherits that provider's per-model
  # output cap (max_tokens). The entrypoint picks the -reasoning variant when the
  # launch model is a reasoning model. This matters because Hermes has no
  # top-level per-model max_tokens: the per-PROVIDER cap on a custom_providers
  # entry is only applied when the top-level model.max_tokens is UNSET (see
  # below), so we deliberately DO NOT set model.max_tokens here.
  provider: "${ALCF_LAUNCH_PROVIDER}"
  base_url: "${ALCF_BASE_URL}"        # e.g. https://inference-api.alcf.anl.gov/resource_server/sophia/vllm/v1
  api_key: "${ALCF_ACCESS_TOKEN}"     # Globus access token, injected + refreshed by entrypoint
  model: "${ALCF_MODEL}"              # e.g. google/gemma-4-31B-it
  default: "${ALCF_MODEL}"

  # NOTE: model.max_tokens is intentionally NOT set here.
  #
  # Reasoning models (gpt-oss-*, gemma-4-*, nemotron-3-super, *-Thinking) emit a
  # hidden reasoning channel that DRAWS FROM THE SAME output budget as the visible
  # answer; too small a cap yields empty content (finish_reason=length). They need
  # more headroom than plain chat models — i.e. a PER-MODEL cap.
  #
  # Hermes has no per-model max_tokens (unlike context_length). It DOES honour a
  # per-PROVIDER max_tokens on a custom_providers entry, but ONLY when the
  # top-level model.max_tokens is unset (runtime_provider._lift_max_output_tokens;
  # api_server / gateway apply the global key first, per-provider second). So
  # populate_models.py splits each cluster into a baseline provider (2048) and a
  # "-reasoning" provider (12288), each with its own max_tokens, and we leave this
  # global key unset so those per-provider caps actually take effect on a /model
  # switch. Both caps are env-tunable: ALCF_MAX_TOKENS / ALCF_REASONING_MAX_TOKENS.

  # The ALCF vLLM gateway rejects a `name` field on role:tool messages with
  # HTTP 422 (extra_forbidden), which breaks agentic tool use. This flag makes
  # Hermes strip it for this provider. REQUIRED for tools to work here.
  strip_tool_message_name: true

  # The REAL serving context window for this model, in tokens (prompt+completion
  # combined). ALCF caps some models below their published spec (e.g. Sophia
  # serves gemma-4-31B-it at 128000, not the 256000 Hermes assumes from the model
  # family). Hermes' hardcoded family table would otherwise over-estimate the
  # window, so its footer/auto-compression fire too late and a request that
  # overflows the real window makes the gateway silently drop the SSE stream
  # (surfaced as EmptyStreamError). Setting model.context_length is the highest-
  # priority override in Hermes, so this makes the footer + compression accurate.
  # entrypoint.sh resolves this from the server's max_model_len at start (falling
  # back to ALCF_CONTEXT_LENGTH / 128000 if the lookup fails).
  context_length: ${ALCF_CONTEXT_LENGTH}

agent:
  # Trim toolsets that make no sense in this packaged, single-user context.
  disabled_toolsets:
    - computer_use
    - image_gen
    - video_gen
    - tts
    - spotify
    - x_search
    - yuanbao

memory:
  # Built-in on-disk memory (MEMORY.md/USER.md), persisted via the /opt/data
  # volume, is always active — no external provider needed. (Do NOT set
  # provider: mnemosyne here; that backend is not in the base image.)
  provider: none

display:
  # Web dashboard is the primary surface; the CLI/TUI still work if exec'd in.
  interface: cli

# Dashboard auth. A containerized dashboard reachable via `docker run -p` must
# bind 0.0.0.0, and Hermes (correctly) refuses a non-loopback bind without an
# auth gate. The entrypoint fills these from ALCF_DASHBOARD_USER /
# ALCF_DASHBOARD_PASSWORD (it hashes the password at start; the plaintext is
# never written to disk). Placeholders left as-is if unset.
dashboard:
  basic_auth:
    username: "${ALCF_DASHBOARD_USER}"
    password_hash: "${ALCF_DASHBOARD_PASSWORD_HASH}"

# Curated switchable models — GENERATED AT CONTAINER START by
# scripts/populate_models.py, which queries the ALCF-specific
# `.../<cluster>/models` endpoint on BOTH clusters (the gateway 404s the standard
# OpenAI `/v1/models` path, so Hermes' own live discovery can't work) and emits
# one `custom_providers` entry per cluster:
#
#   - alcf-sophia  (vLLM,   full OpenAI-compat)   .../sophia/vllm/v1
#   - alcf-metis   (SambaNova, chat-only)         .../metis/api/v1
#
# It filters the catalog to CHAT models (dropping embeddings, vision, and science
# models like GenSLM/dinov3/sam3) and gives each its REAL serving context window.
# This matters because the gateway serves different models — even the SAME-NAMED
# model on different clusters — at very different windows (Sophia gemma-4-31B-it
# =128000 vs Metis gemma-4-31B-it=131072; Metis Mistral-Large-3=8192). Hermes
# honours per-model `custom_providers[].models.<id>.context_length` overrides on
# an in-session `/model` switch (Hermes #15779); without the correct window a
# switch overflows the real context and the gateway silently drops the SSE stream
# (EmptyStreamError). The two providers appear separately in the dropdown so
# same-named models across clusters don't collide.
#
# gpt-oss-* are REASONING models (hidden reasoning consumes max_tokens); the
# non-reasoning models (llama/gemma/mistral/nemotron) feel snappier for plain
# chat. Cold models can take 10-15 min to load on first request.
#
# HOW THE REPLACEMENT WORKS: entrypoint.sh replaces everything from the sentinel
# line below (inclusive) to end-of-file with the generated block. The static
# `custom_providers:` here is a committed FALLBACK that (a) keeps this template
# valid YAML and (b) is used only if the sentinel replacement is skipped
# entirely. populate_models.py ALSO emits its own static fallback on any
# discovery failure, so the live config always has a valid, useful block.
#__ALCF_CUSTOM_PROVIDERS__  (entrypoint replaces from this line to EOF)
custom_providers:
  # NOTE: each cluster is split into a baseline provider (plain chat models,
  # max_tokens 2048) and a "-reasoning" provider (reasoning models, max_tokens
  # 12288). Reasoning models emit a hidden chain-of-thought that shares the output
  # budget, so they need a larger cap. populate_models.py regenerates this at
  # container start from the live catalog (detecting reasoning via the /models
  # reasoning_parser field + an id heuristic); this static block is only a
  # fallback if generation is skipped entirely.
  - name: alcf-sophia
    base_url: "https://inference-api.alcf.anl.gov/resource_server/sophia/vllm/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    max_tokens: 2048
    # NOTE: only models whose REAL ALCF serving window is >= 64000 tokens are
    # listed. Hermes refuses to load any model below its 64k MINIMUM_CONTEXT_LENGTH
    # floor, so a sub-floor model would be a broken dropdown entry. ALCF caps many
    # models (all Llama 3.x/4, Mixtral, Devstral, Mistral-Large-2407) at 16k-32k,
    # so they are intentionally absent here and from the generated live list.
    models:
      argonne/AuroraGPT-IT-v4-0125:
        context_length: 128000
  - name: alcf-sophia-reasoning
    base_url: "https://inference-api.alcf.anl.gov/resource_server/sophia/vllm/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    max_tokens: 12288
    models:
      arcee-ai/Trinity-Large-Thinking-W4A16:
        context_length: 131072
      google/gemma-4-26B-A4B-it:
        context_length: 262144
      google/gemma-4-31B-it:
        context_length: 128000
      nvidia/nemotron-3-super-120b:
        context_length: 262144
      openai/gpt-oss-120b:
        context_length: 65536
      openai/gpt-oss-20b:
        context_length: 128000
  - name: alcf-metis-reasoning
    base_url: "https://inference-api.alcf.anl.gov/resource_server/metis/api/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    max_tokens: 12288
    # Metis reports no server window; values are empirically verified. Only >=64k
    # models are listed — Mistral-Large-3 (Metis) serves at just 8192 and is
    # excluded (Hermes would reject it). Both current Metis models (gemma-4, gpt-oss)
    # are reasoning models, so there is no baseline alcf-metis block in the fallback.
    models:
      gemma-4-31B-it:
        context_length: 131072
      gpt-oss-120b:
        context_length: 131072
