# ALCF Agent — Hermes config template
#
# Rendered into the live config at container start by scripts/entrypoint.sh,
# which substitutes ${...} placeholders from environment variables and injects
# the freshly-minted Globus access token as the api_key.
#
# IMPORTANT: keep this MINIMAL. Do not add personal fallback providers, stray
# base_urls, or secrets. The packaged agent must have exactly ONE inference
# target so it never silently talks to the wrong host.

model:
  # The ALCF Inference Service is OpenAI-compatible. provider: custom tells
  # Hermes to treat base_url as a raw OpenAI-wire endpoint.
  provider: custom
  base_url: "${ALCF_BASE_URL}"        # e.g. https://inference-api.alcf.anl.gov/resource_server/sophia/vllm/v1
  api_key: "${ALCF_ACCESS_TOKEN}"     # Globus access token, injected + refreshed by entrypoint
  model: "${ALCF_MODEL}"              # e.g. google/gemma-4-31B-it
  default: "${ALCF_MODEL}"

  # Reasoning models (gpt-oss-*) spend the output budget on a hidden reasoning
  # channel; too small a cap yields empty content. Give them headroom.
  max_tokens: ${ALCF_MAX_TOKENS}

  # The ALCF vLLM gateway rejects a `name` field on role:tool messages with
  # HTTP 422 (extra_forbidden), which breaks agentic tool use. This flag makes
  # Hermes strip it for this provider. REQUIRED for tools to work here.
  strip_tool_message_name: true

  # The REAL serving context window for this model, in tokens (prompt+completion
  # combined). ALCF caps some models below their published spec (e.g. Sophia
  # serves gemma-4-31B-it at 128000, not the 256000 Hermes assumes from the model
  # family). Hermes' hardcoded family table would otherwise over-estimate the
  # window, so its footer/auto-compression fire too late and a request that
  # overflows the real window makes the gateway silently drop the SSE stream
  # (surfaced as EmptyStreamError). Setting model.context_length is the highest-
  # priority override in Hermes, so this makes the footer + compression accurate.
  # entrypoint.sh resolves this from the server's max_model_len at start (falling
  # back to ALCF_CONTEXT_LENGTH / 128000 if the lookup fails).
  context_length: ${ALCF_CONTEXT_LENGTH}

agent:
  # Trim toolsets that make no sense in this packaged, single-user context.
  disabled_toolsets:
    - computer_use
    - image_gen
    - video_gen
    - tts
    - spotify
    - x_search
    - yuanbao

memory:
  # Built-in on-disk memory (MEMORY.md/USER.md), persisted via the /opt/data
  # volume, is always active — no external provider needed. (Do NOT set
  # provider: mnemosyne here; that backend is not in the base image.)
  provider: none

display:
  # Web dashboard is the primary surface; the CLI/TUI still work if exec'd in.
  interface: cli

# Dashboard auth. A containerized dashboard reachable via `docker run -p` must
# bind 0.0.0.0, and Hermes (correctly) refuses a non-loopback bind without an
# auth gate. The entrypoint fills these from ALCF_DASHBOARD_USER /
# ALCF_DASHBOARD_PASSWORD (it hashes the password at start; the plaintext is
# never written to disk). Placeholders left as-is if unset.
dashboard:
  basic_auth:
    username: "${ALCF_DASHBOARD_USER}"
    password_hash: "${ALCF_DASHBOARD_PASSWORD_HASH}"

# Curated switchable models. The ALCF gateway does NOT serve the standard
# OpenAI `/v1/models` path (404), so we declare a hand-picked model list here
# instead of relying on live discovery. All entries share the same endpoint +
# Globus token, so switching is just a different `model` value.
#
# In the web chat model dropdown (or `/model <id>` in chat), pick any of these.
# The full live catalog is 40+ models (incl. embeddings + science models like
# AuroraGPT/GenSLM); ask the agent "what models are on ALCF inference?" and it
# will query the service directly.
#
# NOTE: gpt-oss-* are REASONING models (hidden reasoning consumes max_tokens);
# the non-reasoning models (llama/gemma/mistral/nemotron) feel snappier for
# plain chat. Cold models can take 10-15 min to load on first request.
custom_providers:
  - name: alcf-inference
    base_url: "${ALCF_BASE_URL}"
    api_key: "${ALCF_ACCESS_TOKEN}"
    # Disable live /v1/models discovery — the ALCF gateway 404s that path.
    discover_models: false
    models:
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - meta-llama/Llama-3.3-70B-Instruct
      - meta-llama/Meta-Llama-3.1-8B-Instruct
      - meta-llama/Llama-4-Maverick-17B-128E-Instruct
      - meta-llama/Llama-4-Scout-17B-16E-Instruct
      - google/gemma-4-31B-it
      - mistralai/Mixtral-8x22B-Instruct-v0.1
      - mistralai/Mistral-Large-Instruct-2407
      - nvidia/nemotron-3-super-120b
      - argonne/AuroraGPT-IT-v4-0125
