name: Build and publish image

# Builds the ALCF Agent image and publishes it to GitHub Container Registry.
# Triggers:
#   - push to main (rolling :latest)
#   - version tags v*      (immutable :vX.Y.Z)
#   - nightly (03:17 UTC)  after docs refresh, so :latest always carries fresh docs
#   - manual dispatch

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/alcf-agent

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # SHA-scoped GHA cache. The image bakes per-commit content (skills,
          # MEMORY.md, config, the version stamp, helper scripts), so a cache
          # shared ACROSS commits once published images two commits behind
          # (COPY/ENV/ARG layers served from a stale cache). Scoping the cache
          # to ${{ github.sha }} makes each commit its own namespace: the first
          # build for a SHA is cold (rebuilds all content — correct), while
          # re-runs of the SAME commit (e.g. a retried job) reuse it, and the
          # heavy base layers (uv install, Caddy copy) are still cached within
          # the run's multi-arch fan-out. No cross-commit staleness possible.
          cache-from: type=gha,scope=${{ github.sha }}
          cache-to: type=gha,scope=${{ github.sha }},mode=max
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ALCF_GIT_SHA=${{ github.sha }}
            ALCF_BUILD_DATE=${{ github.event.repository.updated_at }}
